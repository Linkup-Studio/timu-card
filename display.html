<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>出退勤QR | timu-card</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: #1f2a37;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 24px;
      text-align: center;
    }
    h1 { font-size: 1.4rem; font-weight: 600; letter-spacing: 0.08em; }
    .clock { font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .qr-box {
      background: #fff;
      border-radius: 24px;
      padding: 24px;
      line-height: 0;
    }
    .qr-box img { width: min(70vw, 50vh, 420px); height: auto; image-rendering: pixelated; }
    .note { font-size: 1rem; color: #9ca3af; }
    .countdown { font-size: 0.9rem; color: #6b7280; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <h1>出退勤はこちらのQRから</h1>
  <div class="clock" id="clock">--:--</div>
  <div class="qr-box"><img id="qr" alt="出退勤QRコード"></div>
  <p class="note">スマホのカメラで読み取って打刻してください</p>
  <p class="countdown" id="countdown"></p>

  <script src="js/qrcode.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/token.js"></script>
  <script>
    // 打刻アプリのURL（display.htmlと同じ場所のindex.htmlを指す）
    const APP_URL = location.href.replace(/display\.html.*$/, "");

    async function renderQr() {
      const token = await makeToken(TIMU_SECRET, Date.now());
      const qr = qrcode(0, "M");
      qr.addData(`${APP_URL}?t=${token}`);
      qr.make();
      document.getElementById("qr").src = qr.createDataURL(8, 16);
    }

    function tick() {
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, "0");
      const mm = String(now.getMinutes()).padStart(2, "0");
      const ss = String(now.getSeconds()).padStart(2, "0");
      document.getElementById("clock").textContent = `${hh}:${mm}:${ss}`;
      const remain = Math.ceil(msUntilNextWindow(Date.now()) / 1000);
      document.getElementById("countdown").textContent = `QRは ${remain} 秒後に自動で切り替わります`;
    }

    // 窓の切り替わりに合わせてQRを更新し続ける
    function scheduleNext() {
      setTimeout(async () => {
        await renderQr();
        scheduleNext();
      }, msUntilNextWindow(Date.now()) + 200); // 境界ちょうどのズレ防止に+200ms
    }

    // 画面スリープ防止（対応ブラウザのみ・失敗しても動作に影響なし）
    async function keepAwake() {
      try {
        if ("wakeLock" in navigator) {
          await navigator.wakeLock.request("screen");
          document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible") keepAwake();
          });
        }
      } catch { /* 非対応・拒否時は何もしない */ }
    }

    renderQr();
    scheduleNext();
    tick();
    setInterval(tick, 1000);
    keepAwake();
  </script>
</body>
</html>
